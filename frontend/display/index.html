<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#214b50">
  <title>Trình chiếu - THỜI KHẮC</title>
  <link rel="icon" type="image/png" href="/shared/assets/exhibition-logo.png">
  <link rel="stylesheet" href="led.css?v=20261006-exhibition">
  <link rel="stylesheet" href="presentation.css?v=20261006-exhibition">
  <link rel="stylesheet" href="../ending/session.css">
  <script type="module" src="app.js?v=20261006-exhibition"></script>
</head>
<body>
  <main id="stage" aria-label="THỜI KHẮC — Mỗi nét vẽ – một mảnh ký ức"></main>
  <div id="presentation-hotspot" aria-label="Vùng mở công cụ trình chiếu">
    <div id="presentation-launcher">
      <span id="presentation-hint" role="tooltip">Toàn màn hình <kbd>F</kbd></span>
      <button id="presentation-button" type="button" aria-describedby="presentation-hint" aria-label="Mở toàn màn hình" title="Toàn màn hình (F)">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg>
      </button>
    </div>
  </div>
  <nav id="display-controls" aria-label="Công cụ trình chiếu" hidden>
    <span id="connection-status" role="status">Đang kết nối…</span>
    <button id="reload-button">Làm mới</button>
    <button id="fullscreen-button">Toàn màn hình</button>
    <button id="hide-controls">Ẩn công cụ</button>
  </nav>
  <p id="display-error" role="status" hidden></p>
</body>
</html>
